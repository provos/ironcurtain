name: CI

on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!LICENSE'
  pull_request:
    branches: [master]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-trust-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.1
          cache-dependency-path: docker/build-trust-runtime/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check:build-trust-runtime

  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Node 24 (abi137) and Node 26 (abi147) both have isolated-vm 7.0.1
        # prebuilt binaries → fast install on every PR and every master push.
        os: [ubuntu-latest, macos-latest]
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # Retried: some deps run postinstall scripts that download native binaries
      # from a CDN (e.g. onnxruntime-node via @huggingface/transformers), which
      # intermittently ETIMEDOUT/ENETUNREACH on runners and fails `npm ci`. Retry
      # the whole install a couple times before giving up.
      - name: Install dependencies (retry on transient network failure)
        run: |
          for attempt in 1 2 3; do
            if npm ci --foreground-scripts; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::npm ci attempt $attempt failed; cleaning and retrying in 15s"
              rm -rf node_modules
              sleep 15
            fi
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1
      - name: Report Node ABI and isolated-vm build source
        run: |
          node -e "console.log('ABI', process.versions.modules)"
          test -f node_modules/isolated-vm/build/Release/isolated_vm.node \
            && echo "isolated-vm: SOURCE-COMPILED (build/Release/isolated_vm.node present)" \
            || echo "isolated-vm: PREBUILD (no build/Release/isolated_vm.node)"
      - run: npm run build --workspace=packages/memory-mcp-server
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:cycles
      - run: npm run build
      - name: Run tests
        run: npm test
